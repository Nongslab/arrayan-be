name: CI Quality Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arrayan_hris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arrayan_hris_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arrayan_hris_test?schema=public
      # Secret khusus CI (bukan secret production), panjang >= 32 karakter sesuai requireEnv.
      JWT_SECRET: ci_only_jwt_secret_not_for_production_0001
      COOKIE_SECRET: ci_only_cookie_secret_not_for_production_01

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm test

      - name: Run Integration Tests (PostgreSQL)
        run: npm run test:int

      - name: TypeScript Build Check
        run: npm run build

      - name: Seed Typecheck
        run: npx tsc -p tsconfig.seed.json --noEmit

      - name: Demo Seed Typecheck
        run: npx tsc -p tsconfig.demo.json

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Production Image
        run: docker build -t arrayan-hris-api:ci .

      - name: Smoke Test Image (config validation)
        # Tanpa env wajib, container harus menolak start dan menyebutkan masalahnya.
        run: |
          set +e
          output=$(docker run --rm -e SKIP_MIGRATIONS=true arrayan-hris-api:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -ne 0
          echo "$output" | grep -q "Konfigurasi environment tidak valid"
