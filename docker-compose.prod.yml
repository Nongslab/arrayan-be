# Stack production: API + PostgreSQL. Panduan: docs/DEPLOYMENT.md
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
name: arrayan-hris

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-arrayan_hris}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Tidak dipublikasikan ke host — hanya bisa diakses container API.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: arrayan-hris-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arrayan_hris}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET wajib diisi}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN wajib diisi (https)}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL wajib diisi (https)}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      INVITATION_DRIVER: ${INVITATION_DRIVER:-log}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      # Hanya dipakai seed awal (node dist-seed/seed.js)
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
    # Hanya listen di localhost VPS; akses publik lewat reverse proxy HTTPS (deploy/Caddyfile).
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'

volumes:
  db_data:
